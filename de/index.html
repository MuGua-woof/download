<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>page</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#101018;color:#eee;padding:40px;text-align:center;font-family:system-ui}

#passInput, #fileInputBox{
    width:100%;
    max-width:420px;
    padding:12px;
    border-radius:8px;
    border:none;
    font-size:15px;
    margin-top:12px;
}
#decryptBtn{
    margin-top:12px;
    padding:12px 28px;
    font-size:16px;
    border:none;
    border-radius:10px;
    background:#4285ff;
    color:#fff;
    cursor:pointer;
    user-select:none;
}
#decryptBtn:active{
    transform:scale(0.96);
}
#status{
    margin-top:14px;
    color:#ffaaaa;
}

#chickenBtn{
    margin-top:24px;
    padding:12px 28px;
    font-size:16px;
    border:none;
    border-radius:10px;
    background:#ff7849;
    color:#fff;
    cursor:pointer;
    user-select:none;
}
#chickenBtn:active{
    transform:scale(0.96);
}

.qrcode-wrap{
    margin-top:20px;
    display:none;
}
.qrcode-wrap img{
    max-width:260px;
    width:90%;
    border-radius:12px;
}
.tip{
    font-size:13px;
    color:#bbbbbb;
    margin-top:6px;
}
</style>
</head>
<body>
<h2>资源解密下载</h2>
<h2>记得给木瓜一个好评哦!</h2>
<h2>加QwQ个鸡腿也是可以的</h2>

<div>
    <p style="margin-top:20px;">待解密文件名(.enc)</p>
    <input id="fileInputBox" placeholder="例如：xxx.png.enc，多个用英文逗号分隔">
    <div class="tip">必须填写文件名</div>

    <p style="margin-top:16px;">请输入十六进制密钥进行解密</p>
    <input id="passInput" placeholder="输入十六进制密钥">
    <br>
    <button id="decryptBtn">下载</button>
    <div id="status"></div>
</div>

<button id="chickenBtn">🍗 加个鸡腿</button>

<div class="qrcode-wrap" id="qrBox">
    <img src="https://raw.githubusercontent.com/MuGua-woof/qrcode/refs/heads/main/VX_PAY.png" alt="收款码">
    <p style="margin-top:8px;color:#ccc;">微信扫码</p>
</div>

<script>
const statusDom = document.getElementById("status");

async function hexToArray(hex) {
    const arr = [];
    for(let i = 0; i < hex.length; i += 2) {
        arr.push(parseInt(hex.slice(i, i+2), 16));
    }
    return new Uint8Array(arr);
}

// AES-CBC PKCS7 解密
function pkcs7Unpad(data) {
    const lastByte = data[data.length - 1];
    // 验证填充
    for(let i = data.length - lastByte; i < data.length; i++) {
        if(data[i] !== lastByte) throw new Error("填充无效");
    }
    return data.slice(0, data.length - lastByte);
}

async function decryptAndDownload(fileNameEnc, keyHex) {
    statusDom.innerText = `正在读取：${fileNameEnc}`;
    const resp = await fetch(fileNameEnc);
    if(!resp.ok) throw new Error(`${fileNameEnc} 文件缺失(404)`);
    const buf = await resp.arrayBuffer();

    const rawKey = await hexToArray(keyHex);
    const cryptoKey = await crypto.subtle.importKey(
        "raw", rawKey,
        {name:"AES-CBC"},
        false, ["decrypt"]
    );

    const data = new Uint8Array(buf);
    const iv = data.slice(0,16);
    const cipherText = data.slice(16);

    let plainBuf;
    try {
        const decrypted = await crypto.subtle.decrypt(
            {name:"AES-CBC", iv:iv},
            cryptoKey,
            cipherText
        );
        // Web Crypto 自动处理 PKCS7 填充，直接使用结果
        plainBuf = decrypted;
    } catch(e) {
        throw new Error("密钥错误或文件损坏");
    }

    const originName = fileNameEnc.replace(/\.enc$/,"");
    const blob = new Blob([plainBuf]);
    const objUrl = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = objUrl;
    a.download = originName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(objUrl);
}

document.getElementById("decryptBtn").addEventListener("click", async ()=>{
    statusDom.innerText = "";
    const keyHex = document.getElementById("passInput").value.trim();
    const fileText = document.getElementById("fileInputBox").value.trim();

    // 分割文件名
    const fileList = fileText.split(",").map(s=>s.trim()).filter(s=>s);

    if(fileList.length===0){
        statusDom.innerText = "错误：请填写待解密的 .enc 文件名";
        return;
    }

    if(!/^[0-9a-fA-F]+$/.test(keyHex)){
        statusDom.innerText = "错误：必须输入十六进制字符串密钥";
        return;
    }
    // 密钥长度校验：16/24/32字节 = 32/48/64 十六进制字符
    const keyLen = keyHex.length / 2;
    if(![16,24,32].includes(keyLen)){
        statusDom.innerText = "错误：密钥长度必须为16/24/32字节(32/48/64位十六进制)";
        return;
    }
    try {
        for(const f of fileList) {
            await decryptAndDownload(f, keyHex);
            await new Promise(r=>setTimeout(r,400));
        }
        statusDom.innerText = "下载完成";
    } catch(err) {
        statusDom.innerText = err.message;
    }
})

const btn = document.getElementById("chickenBtn");
const qrBox = document.getElementById("qrBox");
btn.addEventListener("click",()=>{
    qrBox.style.display = qrBox.style.display === "block" ? "none" : "block";
})
</script>
</body>
</html>
