<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>page</title>
<link rel="icon" href="data:,">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#101018;color:#eee;padding:40px;text-align:center;font-family:system-ui}

#passInput, #fileInputBox{
    width:100%;
    max-width:420px;
    padding:12px;
    border-radius:8px;
    border:none;
    font-size:15px;
    margin-top:12px;
}
#decryptBtn{
    margin-top:12px;
    padding:12px 28px;
    font-size:16px;
    border:none;
    border-radius:10px;
    background:#4285ff;
    color:#fff;
    cursor:pointer;
    user-select:none;
}
#decryptBtn:active{
    transform:scale(0.96);
}
#status{
    margin-top:14px;
    color:#ffaaaa;
    min-height:24px;
}
#progressBarWrap{
    max-width:420px;
    margin:12px auto 0;
    height:10px;
    background:#272738;
    border-radius:6px;
    overflow:hidden;
}
#progressBar{
    height:100%;
    width:0%;
    background:#4285ff;
    transition: width 0.2s;
}
#progressText{
    font-size:13px;
    color:#cccccc;
    margin-top:6px;
}

#chickenBtn{
    margin-top:24px;
    padding:12px 28px;
    font-size:16px;
    border:none;
    border-radius:10px;
    background:#ff7849;
    color:#fff;
    cursor:pointer;
    user-select:none;
}
#chickenBtn:active{
    transform:scale(0.96);
}

.qrcode-wrap{
    margin-top:20px;
    display:none;
}
.qrcode-wrap img{
    max-width:260px;
    width:90%;
    border-radius:12px;
}
.tip{
    font-size:13px;
    color:#bbbbbb;
    margin-top:6px;
}
</style>
</head>
<body>
<h2>下载稿件</h2>
<h2>记得给木瓜一个好评哦!</h2>
<h2>加个鸡腿也是可以的，求求了</h2>

<div>
    <p style="margin-top:20px;">文件名</p>
    <input id="fileInputBox" placeholder="多个用英文逗号分隔">
    <div class="tip">必须填写文件名</div>


    <p style="margin-top:16px;">请输入稿件密钥</p>
    <input id="passInput" placeholder="输入十六进制密钥">
    <br>
    <button id="decryptBtn">下载</button>
    <div id="status"></div>

    <div id="progressBarWrap">
        <div id="progressBar"></div>
    </div>
    <div id="progressText"></div>
</div>

<button id="chickenBtn">🍗 加个鸡腿</button>

<div class="qrcode-wrap" id="qrBox">
    <img src="https://raw.githubusercontent.com/MuGua-woof/qrcode/refs/heads/main/VX_PAY.png" alt="收款码">
    <p style="margin-top:8px;color:#ccc;">微信扫码</p>
</div>

<script>
    const statusDom = document.getElementById("status");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");

async function hexToArray(hex) {
    const arr = [];
    for(let i = 0; i < hex.length; i += 2) {
        arr.push(parseInt(hex.slice(i, i+2), 16));
    }
    return new Uint8Array(arr);
}

// fetch超时包装
function fetchWithTimeout(url, timeout=8000){
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(),timeout);
    return fetch(url, {signal:ctrl.signal}).finally(()=>clearTimeout(timer));
}

/**
 * @param {string} fileNameEnc
 * @param {string} keyHex
 * @param {number} current 当前序号
 * @param {number} total 总数量
 */
async function decryptAndDownload(fileNameEnc, keyHex, current, total) {
    const percent = Math.round((current / total) * 100);
    progressBar.style.width = `${percent}%`;

    statusDom.innerText = `[${current}/${total}] 正在读取：${fileNameEnc}`;
    progressText.innerText = `进度 ${percent}% · 请求文件`;

    const resp = await fetchWithTimeout(fileNameEnc);
    if(!resp.ok) throw new Error(`${fileNameEnc} 文件缺失(404)`);

    progressText.innerText = `进度 ${percent}% · 接收二进制数据`;
    const buf = await resp.arrayBuffer();

    progressText.innerText = `进度 ${percent}% · 解析密钥`;
    const rawKey = await hexToArray(keyHex);
    const cryptoKey = await crypto.subtle.importKey(
        "raw", rawKey,
        {name:"AES-CBC"},
        false, ["decrypt"]
    );

    const data = new Uint8Array(buf);
    const iv = data.slice(0,16);
    const cipherText = data.slice(16);

    progressText.innerText = `进度 ${percent}% · AES解密中`;
    let plainBuf;
    try {
        const decrypted = await crypto.subtle.decrypt(
            {name:"AES-CBC", iv:iv},
            cryptoKey,
            cipherText
        );
        plainBuf = decrypted;
    } catch(e) {
        throw new Error("密钥错误或文件损坏");
    }

    progressText.innerText = `进度 ${percent}% · 生成下载`;
    const originName = fileNameEnc.replace(/\.enc$/,"");
    const blob = new Blob([plainBuf]);
    const objUrl = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = objUrl;
    a.download = originName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(objUrl);
}

document.getElementById("decryptBtn").addEventListener("click", async ()=>{
    statusDom.innerText = "";
    progressBar.style.width = "0%";
    progressText.innerText = "";

    const keyHex = document.getElementById("passInput").value.trim();
    const fileText = document.getElementById("fileInputBox").value.trim();

    let fileList = fileText.split(",").map(s=>s.trim()).filter(s=>s);
    // 自动补 .enc
    fileList = fileList.map(name=>{
        if(!name.endsWith(".enc")) return name + ".enc";
        return name;
    });

    if(fileList.length===0){
        statusDom.innerText = "错误：请填写文件名";
        return;
    }

    if(!/^[0-9a-fA-F]+$/.test(keyHex)){
        statusDom.innerText = "错误：必须输入十六进制字符串密钥";
        return;
    }
    const keyLen = keyHex.length / 2;
    if(![16,24,32].includes(keyLen)){
        statusDom.innerText = "错误：密钥长度必须为16/24/32字节(32/48/64位十六进制)";
        return;
    }

    // 禁用按钮防止重复点击
    const decryptBtn = document.getElementById("decryptBtn");
    decryptBtn.disabled = true;
    decryptBtn.innerText = "处理中…";

    try {
        const total = fileList.length;
        for(let idx = 0; idx < total; idx++) {
            const f = fileList[idx];
            await decryptAndDownload(f, keyHex, idx+1, total);
            await new Promise(r=>setTimeout(r,400));
        }
        progressBar.style.width = "100%";
        statusDom.innerText = "✅全部下载完成";
        progressText.innerText = "100% · 任务结束";
    } catch(err) {
        statusDom.innerText = "❌" + err.message;
    }finally{
        decryptBtn.disabled = false;
        decryptBtn.innerText = "下载";
    }
})

const btn = document.getElementById("chickenBtn");
const qrBox = document.getElementById("qrBox");
btn.addEventListener("click",()=>{
    qrBox.style.display = qrBox.style.display === "block" ? "none" : "block";
})
</script>
</body>
</html>
