<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片藏压缩包 PNG+ZIP</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{background:#181822;color:#eee;padding:20px;max-width:650px;margin:0 auto}
button{padding:10px 14px;margin:6px;border:none;border-radius:6px;background:#367bfa;color:#fff;cursor:pointer}
input{margin:8px 0}
#log{background:#222;padding:12px;border-radius:6px;min-height:120px;margin-top:10px;font-size:13px;white-space:pre-wrap}
</style>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<h2>📦 PNG图片内部藏匿ZIP压缩包</h2>

<h4>【合成：图片 + zip → 带隐藏压缩包的PNG】</h4>
<div>
封面图片：<input type="file" id="imgFile" accept="image/png,image/jpeg"><br>
要藏匿的zip包：<input type="file" id="zipFile" accept=".zip"><br>
<button onclick="pack()">🔨合成输出PNG</button>
</div>

<hr style="margin:24px 0;border-color:#333"/>

<h4>【解析：读取PNG，提取里面的zip】</h4>
<div>
载入合成后的png文件：<input type="file" id="packedFile" accept=".png"><br>
<button onclick="unpack()">📂提取压缩包</button>
<button id="downloadZipBtn" onclick="downloadExtractedZip()" disabled>💾下载提取出的ZIP</button>
</div>

<div id="log">日志输出...</div>

<script>
const logEl = document.getElementById("log");
let extractedZip = null; //保存解压后的zip对象
let extractedZipBin = null;

function log(s){
    logEl.innerText += s+"\n";
    logEl.scrollTop = logEl.scrollHeight;
}

async function readFileBuffer(file){
    return new Promise(res=>{
        const r = new FileReader();
        r.onload=e=>res(e.target.result);
        r.readAsArrayBuffer(file);
    })
}

async function pack(){
    logEl.innerText="";
    const imgF = document.getElementById("imgFile").files[0];
    const zipF = document.getElementById("zipFile").files[0];
    if(!imgF||!zipF){
        alert("请选择封面图片和zip压缩包");
        return;
    }
    const imgBuf = await readFileBuffer(imgF);
    const zipBuf = await readFileBuffer(zipF);

    const magic = new TextEncoder().encode("||MYZIPHIDE||");

    const total = new Uint8Array(imgBuf.byteLength + magic.length + zipBuf.byteLength);
    total.set(new Uint8Array(imgBuf),0);
    total.set(magic, imgBuf.byteLength);
    total.set(new Uint8Array(zipBuf), imgBuf.byteLength+magic.length);

    const blob = new Blob([total],{type:"image/png"});
    const a = document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download="pic_hide_zip.png";
    a.click();
    log(`✅合成完成！输出 pic_hide_zip.png\n图片：${(imgBuf.byteLength/1024).toFixed(2)}KB  zip：${(zipBuf.byteLength/1024).toFixed(2)}KB`);
}

async function unpack(){
    logEl.innerText="";
    extractedZip = null;
    extractedZipBin = null;
    document.getElementById("downloadZipBtn").disabled = true;

    const f = document.getElementById("packedFile").files[0];
    if(!f){
        alert("选择合成后的png文件");
        return;
    }
    const buf = await readFileBuffer(f);
    const data = new Uint8Array(buf);
    const magicRaw = new TextEncoder().encode("||MYZIPHIDE||");

    let findPos = -1;
    outer:for(let i=0;i<data.length - magicRaw.length;i++){
        for(let j=0;j<magicRaw.length;j++){
            if(data[i+j]!==magicRaw[j]) continue outer;
        }
        findPos = i;
        break;
    }
    if(findPos===-1){
        log("❌未找到隐藏压缩包标记");
        return;
    }
    extractedZipBin = data.slice(findPos+magicRaw.length);
    log(`✅找到隐藏ZIP，大小 ${(extractedZipBin.byteLength/1024).toFixed(2)} KB`);

    try{
        extractedZip = await JSZip.loadAsync(extractedZipBin);
        document.getElementById("downloadZipBtn").disabled = false;
        log("\n---压缩包内文件列表---");
        for(const name of Object.keys(extractedZip.files)){
            log("· "+name);
        }
    }catch(e){
        log("❌ZIP解压失败："+e.message);
    }
}

//下载提取出来完整zip
async function downloadExtractedZip(){
    if(!extractedZipBin){
        alert("请先提取压缩包");
        return;
    }
    const blob = new Blob([extractedZipBin], {type:"application/zip"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "extract_hidden.zip";
    a.click();
    log("📥已下载 extract_hidden.zip");
}
</script>
</body>
</html>
