<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下载稿件</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#101018;color:#eee;padding:40px;text-align:center;font-family:system-ui}

#passInput, #fileInputBox{
    width:100%;
    max-width:420px;
    padding:12px;
    border-radius:8px;
    border:none;
    font-size:15px;
    margin-top:12px;
}
#decryptBtn{
    margin-top:12px;
    padding:12px 28px;
    font-size:16px;
    border:none;
    border-radius:10px;
    background:#4285ff;
    color:#fff;
    cursor:pointer;
    user-select:none;
}
#decryptBtn:active{
    transform:scale(0.96);
}
#status{
    margin-top:14px;
    color:#ffaaaa;
}

#chickenBtn{
    margin-top:24px;
    padding:12px 28px;
    font-size:16px;
    border:none;
    border-radius:10px;
    background:#ff7849;
    color:#fff;
    cursor:pointer;
    user-select:none;
}
#chickenBtn:active{
    transform:scale(0.96);
}

.qrcode-wrap{
    margin-top:20px;
    display:none;
}
.qrcode-wrap img{
    max-width:260px;
    width:90%;
    border-radius:12px;
}
.tip{
    font-size:13px;
    color:#bbbbbb;
    margin-top:6px;
}

/* 进度条 */
#progressBox{
    display:none;
    margin-top:16px;
    max-width:420px;
    margin-left:auto;
    margin-right:auto;
    text-align:left;
}
#progressBarWrap{
    background:#333;
    border-radius:8px;
    overflow:hidden;
    height:20px;
}
#progressBar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#4285ff,#42c8ff);
    transition:width 0.3s;
}
#progressText{
    margin-top:6px;
    font-size:13px;
    color:#bbb;
}
</style>
</head>
<body>

<h2>下载稿件</h2>
<h2>记得给木瓜一个好评哦!</h2>
<h2>加个鸡腿也是可以的，求求了</h2>

<div>
    <p style="margin-top:20px;">文件名</p>
    <input id="fileInputBox" placeholder="多个用英文逗号分隔">
    <div class="tip">必须填写文件名</div>

    <p style="margin-top:16px;">请输入稿件密钥</p>
    <input id="passInput" placeholder="输入十六进制密钥">
    <br>
    <button id="decryptBtn">下载</button>
    <div id="status"></div>

    <!-- 进度条 -->
    <div id="progressBox">
        <div id="progressBarWrap">
            <div id="progressBar"></div>
        </div>
        <div id="progressText"></div>
    </div>
</div>

<button id="chickenBtn">🍗 加个鸡腿</button>

<div class="qrcode-wrap" id="qrBox">
    <img src="https://raw.githubusercontent.com/MuGua-woof/qrcode/refs/heads/main/VX_PAY.png" alt="收款码">
    <p style="margin-top:8px;color:#ccc;">微信扫码</p>
</div>

<script>
const statusDom = document.getElementById("status");
const progressBox = document.getElementById("progressBox");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");

async function hexToArray(hex) {
    const arr = [];
    for(let i = 0; i < hex.length; i += 2) {
        arr.push(parseInt(hex.slice(i, i+2), 16));
    }
    return new Uint8Array(arr);
}

function formatSize(bytes) {
    if(bytes >= 1048576) return (bytes / 1048576).toFixed(1) + "MB";
    if(bytes >= 1024) return (bytes / 1024).toFixed(1) + "KB";
    return bytes + "B";
}

async function decryptAndDownload(fileNameEnc, keyHex) {
    statusDom.innerText = `正在读取：${fileNameEnc}`;
    progressBox.style.display = "block";
    progressBar.style.width = "0%";
    progressText.innerText = "";

    const resp = await fetch(fileNameEnc);
    if(!resp.ok) throw new Error(`${fileNameEnc} 文件缺失(404)`);

    const contentLength = parseInt(resp.headers.get("Content-Length")) || 0;
    const reader = resp.body.getReader();
    const chunks = [];
    let received = 0;
    let lastTime = performance.now();
    let lastReceived = 0;

    while(true) {
        const {done, value} = await reader.read();
        if(done) break;
        chunks.push(value);
        received += value.length;

        const now = performance.now();
        const elapsed = (now - lastTime) / 1000;
        if(elapsed >= 0.5) {
            const speed = (received - lastReceived) / elapsed;
            lastTime = now;
            lastReceived = received;

            const pct = contentLength ? (received / contentLength * 100).toFixed(1) : "?";
            progressBar.style.width = pct + "%";
            progressText.innerText =
                `速度: ${formatSize(speed)}/s  |  已下载: ${formatSize(received)}` +
                (contentLength ? `  |  总共: ${formatSize(contentLength)}  |  进度: ${pct}%` : "");
        }
    }

    // 合并
    const totalLength = chunks.reduce((acc, c) => acc + c.length, 0);
    const buf = new Uint8Array(totalLength);
    let offset = 0;
    for(const c of chunks) { buf.set(c, offset); offset += c.length; }

    // 解密
    const rawKey = await hexToArray(keyHex);
    const cryptoKey = await crypto.subtle.importKey(
        "raw", rawKey,
        {name:"AES-CBC"},
        false, ["decrypt"]
    );

    const iv = buf.slice(0,16);
    const cipherText = buf.slice(16);

    try {
        const decrypted = await crypto.subtle.decrypt(
            {name:"AES-CBC", iv:iv},
            cryptoKey,
            cipherText
        );
        const originName = fileNameEnc.replace(/\.enc$/,"");
        const blob = new Blob([decrypted]);
        const objUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = objUrl;
        a.download = originName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(objUrl);
    } catch(e) {
        throw new Error("密钥错误或文件损坏");
    }
}

document.getElementById("decryptBtn").addEventListener("click", async ()=>{
    statusDom.innerText = "";
    progressBox.style.display = "none";
    const keyHex = document.getElementById("passInput").value.trim();
    const fileText = document.getElementById("fileInputBox").value.trim();
    const fileList = fileText.split(",").map(s=>s.trim()).filter(s=>s);

    if(fileList.length===0){
        statusDom.innerText = "错误：请填写文件名";
        return;
    }
    if(!/^[0-9a-fA-F]+$/.test(keyHex)){
        statusDom.innerText = "错误：必须输入十六进制字符串密钥";
        return;
    }
    const keyLen = keyHex.length / 2;
    if(![16,24,32].includes(keyLen)){
        statusDom.innerText = "错误：密钥长度必须为16/24/32字节(32/48/64位十六进制)";
        return;
    }
    try {
        for(const f of fileList) {
            await decryptAndDownload(f, keyHex);
            await new Promise(r=>setTimeout(r,400));
        }
        statusDom.innerText = "全部下载完成";
        progressBox.style.display = "none";
    } catch(err) {
        statusDom.innerText = err.message;
    }
})

const btn = document.getElementById("chickenBtn");
const qrBox = document.getElementById("qrBox");
btn.addEventListener("click",()=>{
    qrBox.style.display = qrBox.style.display === "block" ? "none" : "block";
})
</script>
</body>
</html>
